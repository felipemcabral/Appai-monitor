name: Monitorar Caminhadas e Corridas (Appai)

on:
  schedule:
    # roda a cada 3 horas (horário UTC). Ajuste conforme quiser.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba "Actions"

permissions:
  contents: write   # necessário para o job poder salvar o state.json de volta no repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar monitor
        env:
          APPAI_USER: ${{ secrets.APPAI_USER }}
          APPAI_PASS: ${{ secrets.APPAI_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salvar estado (state.json) de volta no repositório
        run: |
          git config user.name "appai-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && echo "Sem mudanças de estado para commitar." || git commit -m "Atualiza estado do monitor"
          git pull --rebase origin main
          git push

      - name: Salvar screenshots de erro (se houver)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            login_debug.png
            login_debug.html
          if-no-files-found: ignore
